[package]
name = "nixe-mail-core"
version = "0.1.0"
description = "Mail store, MIME, search and sync for Nixe Mail"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ammonia = "4.2"
html2text = "0.17"
mail-builder = "1"
mail-parser = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio = { version = "1", features = ["net", "rt", "time", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }


[features]
# An SMTP sink for integration tests.
testing = []

[[test]]
name = "imap"
required-features = ["testing"]

[[test]]
name = "graph"
required-features = ["testing"]
