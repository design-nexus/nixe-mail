name: Independent application checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    steps:
      - name: Prepare Git checkout
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Shared crates must come from published (GitHub) revisions, never a local checkout.
      - name: Dependency publication gate
        run: |
          if grep -R 'file://' --include='Cargo.toml' .; then
            echo 'Local split: publish pinned dependency sources first.'
            exit 1
          fi
      - name: Build prerequisites
        run: |
          source <(sed -n '/^app_info()/,/^}/p' install.sh)
          app_info mail
          bash tools/ci-bootstrap.sh $deps
      - name: Locked build, targeted tests and package
        run: python3 tools/ci.py
